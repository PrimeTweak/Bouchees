name: Unsigned IPA (sideload)

# Produit un .ipa NON SIGNÉ. Feather le signe ensuite avec ton certificat.
# Aucun compte développeur Apple requis : le runner macOS de GitHub a déjà
# Xcode, et XcodeGen fabrique le projet à partir de ios/project.yml.
# Aucun certificat ni clé ne transite par GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Identifiant de bundle (vide = ca.bouchees.app)"
        required: false
        default: ""

jobs:
  construire:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check repository integrity
        # Runs first and costs a second. A folder dropped in the Finder
        # replaces rather than merges, and a partial delivery silently deletes
        # everything it does not carry. Naming the missing file here beats a
        # MODULE_NOT_FOUND thirty minutes into the build.
        run: node tools/check-repo.js

      - name: Run engine tests before building
        # Si les tests tombent, aucun IPA n'est produit. Un moteur cassé qui
        # part sur un téléphone, c'est exactement ce qu'on empêche.
        run: node tests/test.js

      - name: Publish content and build web page
        run: |
          node tools/publish.js
          node web/build.js

      - name: Bundle resources into the iOS app
        # The JavaScript engine and the safety tables travel with the app, so
        # everything works offline from the very first launch. Only the FREE
        # batches are bundled — a file inside an IPA can be read with a text
        # editor, so that would be no wall at all.
        run: |
          R=ios/App/App/Resources
          rm -rf "$R"; mkdir -p "$R/batches"
          cp engine/engine.js engine/native-bridge.js "$R/"
          cp data/ingredients.json data/substitutions.json data/base.json "$R/"
          cp dist/safety.json "$R/" || true
          python3 - <<'PY'
          import json, shutil, pathlib
          m = json.load(open('dist/manifest.json'))
          free = set(m['free'])
          dest = pathlib.Path('ios/App/App/Resources/batches')
          for batch in sorted(free):
              src = pathlib.Path('dist/batches') / (batch + '.json')
              if src.exists():
                  shutil.copy(src, dest / src.name)
                  print('bundled:', batch)
          for b in m['batches']:
              if b['id'] not in free:
                  print('left on the server:', b['id'])
          PY
          ls -R "$R"

      - name: Check Swift sources
        # Pas un compilateur : attrape les symboles manquants, les types en
        # double, les assets absents. Deux secondes ici évitent quinze minutes
        # de build pour une faute qu'on peut voir sans Xcode.
        run: python3 tools/check-swift.py

      - name: XcodeGen
        run: brew install xcodegen

      - name: Custom bundle identifier
        # Si ton profil Feather n'est pas en wildcard, lance le workflow à la
        # main (Actions -> Run workflow) en donnant ton identifiant.
        if: ${{ github.event.inputs.bundle_id != '' }}
        run: |
          BID="${{ github.event.inputs.bundle_id }}"
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER: .*|PRODUCT_BUNDLE_IDENTIFIER: ${BID}|" ios/project.yml
          echo "Bundle identifier : ${BID}"

      - name: Generate the Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -la App.xcodeproj

      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build ad-hoc signed
        # Ad-hoc signing ("-") needs no certificate and no team, but it does
        # produce a real _CodeSignature/CodeResources inside the bundle.
        #
        # Every working IPA in a sideloading library has that folder. A build
        # with CODE_SIGNING_ALLOWED=NO has no signature structure at all, and a
        # resigning tool replaces an existing signature rather than inventing
        # one — with nothing to replace, it cannot read the app.
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tail -60

      - name: Verify the bundle carries a signature
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "--- signature structure ---"
          ls -la "$APP/_CodeSignature" || { echo "NO _CodeSignature — the app cannot be resigned"; exit 1; }
          echo "--- codesign verdict ---"
          codesign -dv "$APP" 2>&1 || true
          echo "--- entitlements carried ---"
          codesign -d --entitlements :- "$APP" 2>&1 || true

      - name: Package as .ipa
        # Packaged with ditto, not zip.
        #
        # An installer reads Payload/*.app/Info.plist straight out of the
        # archive, without extracting it first. `zip` on macOS writes entries
        # some readers cannot walk — resource forks, directory headers, name
        # encoding — which is why a bundle can be perfect once extracted and
        # still read as "Unknown" by the installer.
        #
        # ditto is Apple's own tool for archiving a bundle and produces an
        # archive iOS tooling reliably parses.
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app was produced — see the previous step"; exit 1; fi

          rm -rf sortie && mkdir -p sortie/Payload
          ditto "$APP" "sortie/Payload/$(basename "$APP")"

          # Strip anything macOS may have attached to the copy; an installer
          # walking the archive should meet nothing but the bundle.
          xattr -cr sortie/Payload 2>/dev/null || true
          find sortie -name ".DS_Store" -delete
          find sortie -name "._*" -delete

          ( cd sortie && ditto -c -k --sequesterRsrc --keepParent Payload Bouchees-unsigned.ipa )

          echo "--- archive contents, as an installer sees them ---"
          unzip -l sortie/Bouchees-unsigned.ipa | head -12
          echo "--- the installer must find this entry ---"
          unzip -l sortie/Bouchees-unsigned.ipa | grep -E "Payload/[^/]+\.app/Info\.plist" \
            || { echo "Info.plist is not reachable at Payload/*.app/Info.plist"; exit 1; }
          echo "--- and read it without extracting ---"
          unzip -p sortie/Bouchees-unsigned.ipa "Payload/*.app/Info.plist" > /tmp/plist-from-archive
          plutil -p /tmp/plist-from-archive | grep -E "CFBundleIdentifier|CFBundleShortVersionString|CFBundleName" \
            || { echo "Info.plist unreadable straight from the archive"; exit 1; }
          ls -lh sortie/Bouchees-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bouchees-unsigned-ipa
          path: sortie/Bouchees-unsigned.ipa
          retention-days: 30
