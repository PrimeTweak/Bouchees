name: Unsigned IPA (sideload)

# Produit un .ipa NON SIGNÉ. Feather le signe ensuite avec ton certificat.
# Aucun compte développeur Apple requis : le runner macOS de GitHub a déjà
# Xcode, et XcodeGen fabrique le projet à partir de ios/project.yml.
# Aucun certificat ni clé ne transite par GitHub.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Identifiant de bundle (vide = ca.bouchees.app)"
        required: false
        default: ""

jobs:
  construire:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check repository integrity
        # Runs first and costs a second. A folder dropped in the Finder
        # replaces rather than merges, and a partial delivery silently deletes
        # everything it does not carry. Naming the missing file here beats a
        # MODULE_NOT_FOUND thirty minutes into the build.
        run: node tools/check-repo.js

      - name: Run engine tests before building
        # Si les tests tombent, aucun IPA n'est produit. Un moteur cassé qui
        # part sur un téléphone, c'est exactement ce qu'on empêche.
        run: node tests/test.js

      - name: Publish content and build web page
        run: |
          node tools/publish.js
          node web/build.js

      - name: Bundle resources into the iOS app
        # The JavaScript engine and the safety tables travel with the app, so
        # everything works offline from the very first launch. Only the FREE
        # batches are bundled — a file inside an IPA can be read with a text
        # editor, so that would be no wall at all.
        run: |
          R=ios/App/App/Resources
          rm -rf "$R"; mkdir -p "$R/batches"
          cp engine/engine.js engine/native-bridge.js "$R/"
          cp data/ingredients.json data/substitutions.json data/base.json "$R/"
          cp dist/safety.json "$R/" || true
          python3 - <<'PY'
          import json, shutil, pathlib
          m = json.load(open('dist/manifest.json'))
          free = set(m['free'])
          dest = pathlib.Path('ios/App/App/Resources/batches')
          for batch in sorted(free):
              src = pathlib.Path('dist/batches') / (batch + '.json')
              if src.exists():
                  shutil.copy(src, dest / src.name)
                  print('bundled:', batch)
          for b in m['batches']:
              if b['id'] not in free:
                  print('left on the server:', b['id'])
          PY
          ls -R "$R"

      - name: Check Swift sources
        # Pas un compilateur : attrape les symboles manquants, les types en
        # double, les assets absents. Deux secondes ici évitent quinze minutes
        # de build pour une faute qu'on peut voir sans Xcode.
        run: python3 tools/check-swift.py

      - name: XcodeGen
        run: brew install xcodegen

      - name: Custom bundle identifier
        # Si ton profil Feather n'est pas en wildcard, lance le workflow à la
        # main (Actions -> Run workflow) en donnant ton identifiant.
        if: ${{ github.event.inputs.bundle_id != '' }}
        run: |
          BID="${{ github.event.inputs.bundle_id }}"
          sed -i '' "s|PRODUCT_BUNDLE_IDENTIFIER: .*|PRODUCT_BUNDLE_IDENTIFIER: ${BID}|" ios/project.yml
          echo "Bundle identifier : ${BID}"

      - name: Generate the Xcode project
        run: |
          cd ios
          xcodegen generate --spec project.yml
          ls -la App.xcodeproj

      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build unsigned
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            clean build 2>&1 | tail -60

      - name: Inspect the built Info.plist
        # A third-party installer reads these keys to show the name, the
        # identifier and the version. If any of them is empty the app shows up
        # as "Unknown" and will not install — so fail here, not on the phone.
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "No .app was produced"; exit 1; fi
          PLIST="$APP/Info.plist"
          echo "--- $PLIST ---"
          plutil -p "$PLIST"
          echo "--- required keys ---"
          FAIL=0
          for KEY in CFBundleIdentifier CFBundleName CFBundleExecutable \
                     CFBundleShortVersionString CFBundleVersion CFBundlePackageType; do
            VALUE=$(/usr/libexec/PlistBuddy -c "Print :$KEY" "$PLIST" 2>/dev/null || true)
            if [ -z "$VALUE" ]; then echo "  MISSING  $KEY"; FAIL=1
            else echo "  ok       $KEY = $VALUE"; fi
          done
          echo "--- icon files produced by actool ---"
          ls "$APP" | grep -i "^AppIcon" || { echo "  no AppIcon file in the bundle"; FAIL=1; }
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")"
          if [ ! -f "$BIN" ]; then echo "  MISSING  executable at $BIN"; FAIL=1
          else echo "  ok       executable present"; fi
          exit $FAIL

      - name: Package as .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          if [ -z "$APP" ]; then echo "Aucun .app produit — voir l'étape précédente"; exit 1; fi
          mkdir -p sortie/Payload
          cp -R "$APP" sortie/Payload/
          cd sortie && zip -qry Bouchees-unsigned.ipa Payload && cd ..
          ls -lh sortie/Bouchees-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bouchees-unsigned-ipa
          path: sortie/Bouchees-unsigned.ipa
          retention-days: 30
