name: Weekly cycle

# Tous les lundis à 7 h, heure de Montréal (11 h UTC).
#
# Le robot fait tout le travail — trouver les trous, faire rédiger, valider,
# vérifier la cohérence, générer les images, les faire vérifier par vision —
# puis ouvre une DEMANDE DE FUSION.
#
# Il ne publie pas tout seul, et c'est délibéré. Techniquement, des recettes
# générées le lundi pourraient se retrouver dans l'app le mardi sans qu'un
# humain les ait jamais vues. Sur une app d'allergies pour bébés, la
# différence entre « le code vérifie » et « le code vérifie ET quelqu'un
# regarde » vaut les deux minutes que ça coûte.

"on":
  schedule:
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      recettes:
        description: "Nombre de recettes à commander (vide = ce que le rapport de trous demande)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check repository integrity
        # Runs first and costs a second. A folder dropped in the Finder
        # replaces rather than merges, and a partial delivery silently deletes
        # everything it does not carry. Naming the missing file here beats a
        # MODULE_NOT_FOUND thirty minutes into the build.
        run: node tools/check-repo.js

      - name: Run engine tests first
        run: node tests/test.js

      - name: Cycle
        # Sans clé, le cycle tourne en mode simulé : la mécanique se vérifie,
        # le contenu est factice. Avec la clé, il rédige pour vrai.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MOTEUR_IMAGE: ${{ secrets.MOTEUR_IMAGE || 'simule' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node tools/cycle.js

      - name: Re-run tests after generation
        # Le cycle a ajouté des recettes : l'invariant doit tenir sur le
        # corpus élargi, pas seulement sur celui d'avant.
        run: node tests/test.js

      - name: Rolling window status
        run: node tools/weeks.js

      - name: Open the pull request
        uses: peter-evans/create-pull-request@v6
        with:
          branch: cycle/semaine-automatique
          delete-branch: true
          title: "Recettes de la semaine"
          commit-message: "Cycle hebdomadaire — nouvelles recettes"
          body: |
            Généré automatiquement par le cycle hebdomadaire.

            **À regarder avant de fusionner :**
            - les recettes ajoutées dans `data/generated/`
            - le journal dans `tools/cycle-log.json` (rejets et réserves)
            - `tools/gap-report.md` pour voir ce qui manquait

            Ce que le cycle a déjà vérifié : allergènes, âges, ingrédients hors
            catalogue, proportions, étapes incomplètes, intrus dans les images.

            Ce qu'il n'a pas vérifié : le goût, la levée, la texture réelle.
            Une recette non cuisinée peut être ratée — jamais dangereuse.
