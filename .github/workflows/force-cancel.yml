name: Force cancel run

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the workflow run to force cancel"
        required: true

permissions:
  actions: write

jobs:
  force-cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel the target run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            -H "Accept: application/vnd.github+json" \
            "repos/${{ github.repository }}/actions/runs/${{ inputs.run_id }}/force-cancel"
