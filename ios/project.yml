name: App
options:
  bundleIdPrefix: ca.bouchees
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: '16.0'
settings:
  base:
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ''
    CODE_SIGNING_REQUIRED: 'NO'
    CODE_SIGNING_ALLOWED: 'NO'
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_EMIT_LOC_STRINGS: true
targets:
  App:
    type: application
    platform: iOS
    sources:
    - path: App/App/Models
    - path: App/App/Core
    - path: App/App/Illustration
    - path: App/App/Components
    - path: App/App/Screens
    - path: App/App/Services
    - path: App/App/Assets.xcassets
    - path: App/App/Bouchees.storekit
    - path: App/App/Localization
      type: group
    - path: App/App/Bundled
      type: folder
      buildPhase: resources
    info:
      path: App/App/Info.plist
      properties:
        CFBundleDisplayName: Bouchées
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # THIS FILE IS THE SOURCE OF THE LAUNCH SCREEN, not Info.plist.
        # XcodeGen writes App/App/Info.plist from these properties on every
        # build, so a change made there is overwritten and has no effect.
        #
        # No UIImageName. A launch image is drawn at its native size and
        # centred: the wordmark asset is wider than the screen, so it appeared
        # cut off for the fraction of a second before the first SwiftUI frame.
        # The colour alone matches the canvas and the mark is drawn in
        # LaunchView, with an animation an image cannot have.
        #
        # Canvas, not Fond: Tone.canvas is 0xFBF9F6 and Fond is 0xF1F3EC, so
        # the launch field was a different colour from the screen replacing it.
        UILaunchScreen:
          UIColorName: Canvas
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Bouchées utilise la caméra pour lire le code-barres d'un produit et
          vérifier sa liste d'ingrédients. Aucune photo n'est enregistrée ni envoyée.
        CFBundleDevelopmentRegion: fr-CA
        CFBundleLocalizations:
        - fr
        - en
        BoucheesServeur: https://bouchees.onrender.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.bouchees.app
        PRODUCT_NAME: Bouchees
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
    entitlements:
      path: App/App/App.entitlements
      properties:
        com.apple.developer.in-app-payments: []
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
