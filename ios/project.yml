# project.yml — XcodeGen
#
# Le .xcodeproj est GÉNÉRÉ à partir de ce fichier, à chaque build.
# Conséquences : rien à ouvrir dans Xcode, et surtout aucun .xcodeproj dans le
# dépôt — c'est un fichier binaire-ish qui se corrompt aux fusions et qui cause
# la moitié des conflits Git d'un projet iOS.
#
# Local :   xcodegen generate --spec ios/project.yml
# CI :      fait automatiquement par .github/workflows/ipa.yml

name: App
options:
  bundleIdPrefix: ca.bouchees
  deploymentTarget:
    iOS: "17.0"          # StoreKit 2 et les API SwiftUI utilisées
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "16.0"

settings:
  base:
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""              # vide : on ne signe pas ici
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGNING_ALLOWED: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  App:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "web/**"        # ajouté juste après en ressource-dossier
      # « folder » (et non « group ») préserve l'arborescence dans le bundle.
      # Sans ça, index.html et ses fichiers sont aplatis et le chargement
      # local échoue silencieusement.
      - path: App/web
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bouchées
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: >-
          Bouchées utilise la caméra pour lire le code-barres d'un produit et
          vérifier sa liste d'ingrédients. Aucune photo n'est enregistrée ni
          envoyée.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.bouchees.app
        PRODUCT_NAME: Bouchees
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    # In-App Purchase : déclaré ici pour que la capacité existe dans le projet.
    # Elle ne servira qu'avec un vrai profil de provisionnement; en sideload
    # avec un certificat resigné, la liste de produits reviendra simplement
    # vide, et l'app le dit à l'écran.
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.in-app-payments: []
