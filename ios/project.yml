name: App
options:
  bundleIdPrefix: ca.bouchees
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: '16.0'
settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ''
    CODE_SIGNING_REQUIRED: false
    CODE_SIGNING_ALLOWED: false
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_EMIT_LOC_STRINGS: true
targets:
  App:
    type: application
    platform: iOS
    sources:
    - path: App/App/Models
    - path: App/App/Core
    - path: App/App/Illustration
    - path: App/App/Components
    - path: App/App/Screens
    - path: App/App/Services
    - path: App/App/Assets.xcassets
    - path: App/App/Bouchees.storekit
    - path: App/App/Localization
      type: group
    - path: App/App/Resources
      type: folder
      buildPhase: resources
    info:
      path: App/App/Info.plist
      properties:
        CFBundleDisplayName: Bouchées
        CFBundleShortVersionString: 1.0.0
        CFBundleVersion: '1'
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Canvas
          UIImageName: LaunchWordmark
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Bouchées uses the camera to read a product barcode and check its ingredient
          list. No photo is stored or sent anywhere.
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
        - en
        - fr
        BoucheesServeur: https://bouchees.onrender.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.bouchees.app
        PRODUCT_NAME: Bouchees
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
    entitlements:
      path: App/App/App.entitlements
      properties:
        com.apple.developer.in-app-payments: []
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
