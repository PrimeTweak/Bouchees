name: App
options:
  bundleIdPrefix: ca.bouchees
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: '16.0'
settings:
  base:
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '5.10'
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ''
    CODE_SIGNING_REQUIRED: false
    CODE_SIGNING_ALLOWED: false
    ENABLE_USER_SCRIPT_SANDBOXING: false
    SWIFT_EMIT_LOC_STRINGS: true
targets:
  App:
    type: application
    platform: iOS
    sources:
    - path: App/App/Modeles
    - path: App/App/Moteur
    - path: App/App/Illustration
    - path: App/App/Composants
    - path: App/App/Ecrans
    - path: App/App/Services
    - path: App/App/Assets.xcassets
    - path: App/App/Bouchees.storekit
    - path: App/App/Ressources
      type: folder
      buildPhase: resources
    info:
      path: App/App/Info.plist
      properties:
        CFBundleDisplayName: Bouchées
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
        - UIInterfaceOrientationPortrait
        - UIInterfaceOrientationLandscapeLeft
        - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Bouchées utilise la caméra pour lire le code-barres d'un produit et
          vérifier sa liste d'ingrédients. Aucune photo n'est enregistrée ni envoyée.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.bouchees.app
        PRODUCT_NAME: Bouchees
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: 1,2
    entitlements:
      path: App/App/App.entitlements
      properties:
        com.apple.developer.in-app-payments: []
schemes:
  App:
    build:
      targets:
        App: all
    run:
      config: Debug
    archive:
      config: Release
